name: Static site checks

on:
  push:
    branches:
      - feature/visual-commerce-refresh
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run static site regression tests
        run: python -m unittest tests.test_static_site -v

      - name: Check product catalog JavaScript syntax
        run: node --check products.js

      - name: Check site JavaScript syntax
        run: node --check script.js
