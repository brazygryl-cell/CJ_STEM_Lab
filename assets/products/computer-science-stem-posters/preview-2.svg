<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
<title id="title">Three print sizes</title><desc id="desc">Product information graphic showing letter, legal, and tabloid size options.</desc>
<rect width="1600" height="1200" fill="#fff6e6"/><rect x="55" y="55" width="1490" height="1090" rx="46" fill="#fff" stroke="#17385f" stroke-width="9"/>
<text x="800" y="170" text-anchor="middle" font-family="Arial Rounded MT Bold, Arial, sans-serif" font-size="76" font-weight="900" fill="#17385f">PRINT IT YOUR WAY</text>
<g transform="translate(150 290)">
<rect x="0" y="0" width="360" height="570" rx="34" fill="#f2fbfb" stroke="#18b8b2" stroke-width="8"/><text x="180" y="190" text-anchor="middle" font-family="Arial Rounded MT Bold, Arial, sans-serif" font-size="58" font-weight="900" fill="#17385f">8.5×11</text><text x="180" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" fill="#607184">LETTER</text><text x="180" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#607184">Standard classroom</text><text x="180" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#607184">printer size</text>
<rect x="470" y="0" width="360" height="650" rx="34" fill="#f8f4ff" stroke="#7d69c8" stroke-width="8"/><text x="650" y="225" text-anchor="middle" font-family="Arial Rounded MT Bold, Arial, sans-serif" font-size="58" font-weight="900" fill="#17385f">8.5×14</text><text x="650" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" fill="#607184">LEGAL</text><text x="650" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#607184">More vertical space</text><text x="650" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#607184">for wall display</text>
<rect x="940" y="0" width="360" height="760" rx="34" fill="#fff3ef" stroke="#ee675f" stroke-width="8"/><text x="1120" y="265" text-anchor="middle" font-family="Arial Rounded MT Bold, Arial, sans-serif" font-size="58" font-weight="900" fill="#17385f">11×17</text><text x="1120" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" fill="#607184">TABLOID</text><text x="1120" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#607184">Large-format</text><text x="1120" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#607184">bulletin-board option</text>
</g>
<text x="800" y="1080" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#18b8b2">CJ STEM Lab • Size guide</text>
</svg>
