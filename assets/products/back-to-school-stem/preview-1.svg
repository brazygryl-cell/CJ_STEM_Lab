<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Back to School STEM activities included</title><desc id="desc">Overview graphic listing the nine student activities in the printable bundle.</desc><rect width="1200" height="900" fill="#f2fbfb"/><rect x="45" y="45" width="1110" height="810" rx="44" fill="#fff" stroke="#17385f" stroke-width="9"/><text x="600" y="150" text-anchor="middle" font-family="Arial Rounded MT Bold,Arial,sans-serif" font-size="64" font-weight="900" fill="#17385f">9 ACTIVITIES INCLUDED</text><g font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#26384a"><text x="145" y="260">1. STEM About Me</text><text x="145" y="325">2. Where Is STEM Around Us?</text><text x="145" y="390">3. Technology Around Me</text><text x="145" y="455">4. Is It Technology?</text><text x="145" y="520">5. My Morning Algorithm</text><text x="650" y="260">6. How Did You Get to School?</text><text x="650" y="325">7. PB&amp;J Algorithm Challenge</text><text x="650" y="390">8. Debug the PB&amp;J!</text><text x="650" y="455">9. Design a Better School</text></g><rect x="200" y="635" width="800" height="120" rx="34" fill="#fff6e6" stroke="#f4873f" stroke-width="6"/><text x="600" y="685" text-anchor="middle" font-family="Arial Rounded MT Bold,Arial,sans-serif" font-size="38" font-weight="900" fill="#17385f">PRINT • WRITE • DISCUSS • DESIGN</text><text x="600" y="730" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" fill="#607184">Low-prep first-week STEM + technology practice</text><text x="600" y="820" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#18b8b2">CJ STEM Lab • Product overview</text></svg>